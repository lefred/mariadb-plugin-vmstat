name: Build and package VMSTAT plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: vmstat
      plugin_directory: vmstat
      build_target: vmstat
      plugin_library: vmstat.so
      cmake_options: -DPLUGIN_VMSTAT=DYNAMIC
      test_suite: vmstat
      run_tests: true
